name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ho-nl/deployyy/.github/workflows/magento2-build.yml@main
    permissions:
      contents: read
      packages: write
      actions:  read
      id-token: write
    with:
      vars: ${{ toJSON(vars) }}
    secrets:
      all: ${{ toJSON(secrets) }}
