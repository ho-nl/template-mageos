# Preview build — every branch except main.
#
# Each branch is its own environment on the platform, and an environment can only
# deploy a commit that has a verified image. So every branch push must build, or the
# preview sits in ImageResolved=NoVerifiedBuild forever.
#
# Images are commit-keyed with NO branch slug: the same commit on two branches IS
# the same image, which is what makes a merge deploy instantly.
#
# See .github/workflows/build.yml for the full model.
name: Preview build

on:
  push:
    branches-ignore: [main]

concurrency:
  group: preview-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    uses: ho-nl/deployyy/.github/workflows/magento2-build.yml@main
    # Every variable and secret, in one go, never named: this is the same in
    # every project, and nothing here changes when you add a value. Put the
    # values in GitHub (Settings -> Secrets and variables -> Actions, or a
    # GitHub Environment named after the branch to override them); they reach
    # the build and, after it, the running shop. See README "Variables and
    # secrets".
    #
    # `secrets: all` and not `secrets: inherit`: inherit only reaches a
    # reusable workflow in this repository's own organization, and the build
    # lives in ho-nl.
    permissions:
      contents: read
      packages: write   # push the images
      actions: read     # find the GitHub Environment named after the branch
      id-token: write   # prove to Deployyy which repository and branch this is
    with:
      vars: ${{ toJSON(vars) }}
    secrets:
      all: ${{ toJSON(secrets) }}
